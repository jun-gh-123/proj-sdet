services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        http_proxy: ${http_proxy}
        https_proxy: ${https_proxy}
        NO_PROXY: localhost,app
    ports:
      - "3000:3000"
    environment:
      http_proxy: ${http_proxy}
      https_proxy: ${https_proxy}
      NO_PROXY: localhost,app
      DATABASE_URL: postgres://pg:pg@db:5432/appdb
    command: sh -c "npm run db:migrate && npm run start"
    volumes:
      - ./:/app
      - /app/node_modules
    depends_on:
      db:
        condition: service_healthy

  db:
    image: postgres:16
    environment:
      POSTGRES_USER: pg
      POSTGRES_PASSWORD: pg
      POSTGRES_DB: appdb
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pg -d appdb"]
      interval: 5s
      timeout: 5s
      retries: 5

  e2e:
    build:
      context: .
      dockerfile: Dockerfile.e2e
    profiles:
      - e2e
    depends_on:
      - app
    environment:
      NO_PROXY: localhost,app
    volumes:
      - ./tests/e2e:/app/e2e
      - ./db:/app/db

volumes:
  pgdata:
